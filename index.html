<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Infinity Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070b12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--acc:#35eaff;--accrgb:53,234,255;--acc2:#2f80ff;--acc2rgb:47,128,255;--wall:none;--ca:.055;--blurpx:20px;--bg:radial-gradient(circle at top,#12354b,#070b12 55%);--card:rgba(255,255,255,var(--ca));--bd:rgba(150,235,255,.15);--blur:blur(var(--blurpx))}
body[data-theme=dark]{--bg:#090d13;--card:#121a25;--bd:#1f2c3b;--blur:none}
body[data-theme=blue]{--bg:linear-gradient(160deg,#0b3a9e,#050f2b 70%);--card:rgba(47,128,255,calc(var(--ca)*2.5));--bd:rgba(120,180,255,.3)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#f4fbff;background:var(--bg) fixed}
.hidden{display:none!important}
.app{max-width:480px;margin:auto;padding:22px 17px}
.logo{font-size:25px;font-weight:bold;letter-spacing:-1px}
.logo span,.cyan{color:var(--acc)}
.muted{color:#91a7b7;font-size:14px}
.glass{background:var(--card);border:1px solid var(--bd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:22px;box-shadow:0 10px 35px #0003}
input,textarea{width:100%;padding:15px;margin:0 0 12px;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;color:#fff;font-size:15px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:rgba(var(--accrgb),0.53)}
button{cursor:pointer;font-family:inherit}
.btn{width:100%;padding:15px;margin-bottom:10px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019;font-size:15px;font-weight:bold}
.btn.ghost{background:rgba(var(--accrgb),0.07);border:1px solid rgba(var(--accrgb),0.33);color:var(--acc)}
.err{color:#ff8a9b;font-size:13px;min-height:18px;margin:4px 0 0}
.box{padding:22px;margin-top:22px}
header{display:flex;align-items:center;justify-content:space-between}
.icon{width:43px;height:43px;border-radius:15px;border:1px solid rgba(var(--accrgb),0.27);background:rgba(var(--accrgb),0.07);color:var(--acc);font-size:20px}
.welcome{margin:24px 0 16px}
.welcome h1{font-size:28px;margin:0 0 6px}
.chat{display:flex;align-items:center;gap:13px;padding:13px 12px;margin-bottom:10px;cursor:pointer}
.avatar{width:50px;height:50px;border-radius:18px;flex-shrink:0;position:relative;background:linear-gradient(135deg,#164b60,#101723);border:1px solid rgba(var(--accrgb),0.4);display:grid;place-items:center;font-size:21px;font-weight:bold;color:var(--acc)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.avatar.sm{width:40px;height:40px;border-radius:14px;font-size:17px}
.avatar.big{width:96px;height:96px;border-radius:30px;font-size:38px;margin:0 auto 18px;cursor:pointer}
.dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;background:#3cffac;border:2px solid #0a121b;border-radius:50%}
.name{font-weight:bold;margin-bottom:4px}
.empty{padding:18px;text-align:center}
#chatView{display:flex;flex-direction:column;height:calc(100dvh - 44px)}
.chathead{display:flex;align-items:center;gap:12px;padding:10px 14px}
#chatStatus{font-size:12px;color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
.msg small{display:block;font-size:10px;color:#ffffff88;text-align:right;margin-top:3px}
.msg img{display:block;max-width:100%;border-radius:12px}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(var(--accrgb),0.2),rgba(var(--acc2rgb),0.33));border:1px solid rgba(var(--accrgb),0.33);border-bottom-right-radius:6px}
.msg.theirs{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid #ffffff1a;border-bottom-left-radius:6px}
#sendForm{display:flex;gap:8px;align-items:center;padding:8px}
#sendForm input{margin:0;flex:1}
#sendForm button{width:46px;height:46px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#071019;font-size:19px}
#sendForm #camBtn{background:rgba(var(--accrgb),0.07);border:1px solid rgba(var(--accrgb),0.33);color:var(--acc)}
.chips{display:flex;gap:8px;margin:0 0 18px}
.chip{flex:1;padding:12px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:14px}
.chip.on{border-color:var(--acc);color:var(--acc)}
label{display:block;font-size:13px;color:#91a7b7;margin:0 0 6px 2px}
.chat .grow{flex:1;min-width:0}
.chat .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{text-align:right;flex-shrink:0}
.time{font-size:11px;color:#91a7b7}
.badge{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:20px;background:var(--acc);color:#071019;font-size:11px;font-weight:bold}
.tick{color:#ffffff88}.tick.seen{color:var(--acc)}
.typing::after{content:"";display:inline-block;width:1.4em;text-align:left;animation:dots 1.2s steps(1,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#070b12;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{filter:drop-shadow(0 0 8px var(--acc))}
#splash path{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.quote{max-width:230px;padding:3px 8px;margin-bottom:6px;font-size:12px;background:#0003;border-left:3px solid var(--acc);border-radius:6px}
.quote div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfe9f2}
.rx{display:inline-block;margin-top:5px;padding:2px 9px;border-radius:12px;background:#ffffff1f;font-size:13px}
#replyBar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;margin-bottom:6px;font-size:13px;border-left:3px solid var(--acc)}
#replyBar div div{max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#91a7b7}
#replyX{background:none;border:0;color:var(--acc);font-size:18px}
#sheet{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{width:100%;max-width:480px;margin:0 12px 18px;padding:14px}
#emojis{display:flex;justify-content:space-between;margin-bottom:10px}
.em{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff22;background:#ffffff10;font-size:23px}
.em.on{border-color:var(--acc);background:rgba(var(--accrgb),0.13)}
.sbtn{display:block;width:100%;padding:13px;margin-top:6px;border:0;border-radius:14px;background:#ffffff10;color:#fff;font-size:15px;text-align:left}
.sbtn.danger{color:#ff8a9b}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:enter .25s ease-out}
  @keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  #splash path{stroke-dashoffset:1;animation:draw 1.5s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  #splash .logo{animation:fadeup .8s .6s ease-out both}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  button:active{transform:scale(.96)}
}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px}
.story{flex:0 0 auto;width:64px;text-align:center;font-size:12px;cursor:pointer}
.story .avatar{margin:0 auto 6px}
.story > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar.ring{border:2px solid var(--acc);box-shadow:0 0 12px rgba(var(--accrgb),0.4)}
.plus{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#071019;display:grid;place-items:center;font-size:15px;font-weight:bold;border:2px solid #0a121b}
#stSheet{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:flex-end;justify-content:center}
#viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
#vbars{display:flex;gap:4px;padding:12px 10px 6px}
#vbars i{flex:1;height:3px;border-radius:3px;background:#ffffff40;overflow:hidden}
#vbars i b{display:block;height:100%;width:0;background:var(--acc)}
#vbars i.done b{width:100%}
#vbars i.run b{width:100%;transition:width 5s linear}
#vhead{display:flex;align-items:center;gap:10px;padding:6px 14px}
#vhead .grow{flex:1;min-width:0}
#vwrap{flex:1;position:relative;display:flex;min-height:0}
#vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#vbody img{max-width:100%;max-height:100%;object-fit:contain}
#vbody .txt{width:100%;height:100%;padding:30px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;text-align:center;word-break:break-word}
.vz{position:absolute;top:0;bottom:0}
#vprev{left:0;width:35%}
#vnext{right:0;width:65%}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(var(--accrgb),.55));flex-shrink:0}
.icon{display:grid;place-items:center;padding:0}
#sendForm button{display:grid;place-items:center;padding:0}
#sendForm button[type=submit] .ic,.camb .ic,.btn .ic{filter:none}
.sbtn{display:flex;align-items:center;gap:12px}
.sbtn .ic{width:20px;height:20px}
#msgs,.wallbox{background:var(--wall);border-radius:18px}
#msgs{padding:14px 8px}
.wallbox{padding:14px;display:flex;flex-direction:column;gap:8px}
body[data-bubble=solid] .msg.mine{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121a;border:0}
body[data-bubble=solid] .msg.mine small,body[data-bubble=solid] .tick.seen{color:#04121a}
body[data-bubble=soft] .msg{border-radius:24px}
body[data-bubble=soft] .msg.mine{border-bottom-right-radius:8px}
body[data-bubble=soft] .msg.theirs{border-bottom-left-radius:8px}
body[data-bubble=outline] .msg.mine{background:transparent;border:1.5px solid var(--acc)}
body[data-bubble=outline] .msg.theirs{background:transparent;border:1.5px solid #ffffff44}
.hero{margin-top:18px;padding-bottom:18px;text-align:center}
.banner{height:92px;border-radius:22px 22px 0 0;background:linear-gradient(135deg,var(--acc),var(--acc2));opacity:.85}
.heroav{position:relative;width:96px;margin:-48px auto 10px}
.heroav .avatar{margin:0;border:3px solid #0a121b}
.camb{position:absolute;right:-6px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#04121a;display:grid;place-items:center;border:3px solid #0a121b;cursor:pointer}
.camb .ic{width:16px;height:16px}
.heroname{font-size:22px;font-weight:bold}
.list{padding:6px;margin-top:14px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;background:none;color:#fff;font-size:15px;text-align:left;border-radius:16px}
.row span{flex:1}
.row:active{background:#ffffff10}
.row .ic{color:var(--acc)}
.row .chev{opacity:.5;width:18px;filter:none}
.row.danger{color:#ff8a9b}
.row.danger .ic{color:#ff8a9b;filter:none}
.swatches{display:flex;gap:14px;flex-wrap:wrap;margin:6px 4px 20px}
.sw{width:38px;height:38px;border-radius:50%;border:0;outline:2px solid #ffffff22;outline-offset:3px}
.sw.on{outline-color:#fff}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.opt{padding:10px 14px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:14px}
.opt.on{border-color:var(--acc);color:var(--acc)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc);margin:0 0 14px;height:30px}
label b{color:var(--acc);margin-left:6px}
.hint{font-size:12px;color:#91a7b7;margin:0}
.hbtns{display:flex;gap:10px}
.gav{color:var(--acc)}
.gav .ic{width:26px;height:26px}
.avatar.sm.gav .ic{width:20px;height:20px}
.sname{font-size:12px;font-weight:bold;color:var(--acc);margin-bottom:3px}
.pick .check{width:24px;height:24px;border-radius:50%;border:2px solid #ffffff44;display:grid;place-items:center;flex-shrink:0}
.pick.on .check{background:var(--acc);border-color:var(--acc)}
.pick.on .check::after{content:"✓";color:#04121a;font-size:14px;font-weight:bold}
#photoView{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#pvbar{display:flex;justify-content:space-between;padding:10px 12px}
#pvWrap{flex:1;overflow:auto;display:flex;min-height:0}
#pvWrap img{margin:auto;max-width:100%;max-height:100%;object-fit:contain}
#pvWrap img.zoomed{max-width:none;max-height:none;width:220%}
.tg{width:42px;height:24px;border-radius:12px;background:#ffffff26;position:relative;flex-shrink:0;font-style:normal}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--acc)}
.tg.on::after{left:21px;background:#04121a}
.badge.mute{background:#ffffff40;color:#fff}
.chathead > div,#chatAv{cursor:pointer}
.heroav .avatar.gav{margin:0}
.voice{display:flex;align-items:center;gap:10px;min-width:190px}
.vplay{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#04121a;display:grid;place-items:center;padding:0;flex-shrink:0}
.vplay .ic{width:18px;height:18px;filter:none}
.vbar{flex:1;height:4px;border-radius:4px;background:#ffffff40;overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:var(--acc)}
body[data-bubble=solid] .msg.mine .vplay{background:#04121a;color:var(--acc)}
body[data-bubble=solid] .msg.mine .vbar i{background:#04121a}
.vtime{font-size:12px;color:#ffffffaa}
#recBar{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:6px}
#recBar .grow{flex:1}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff4d6d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rbtn{padding:8px 14px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff}
.rbtn.ok{background:var(--acc);color:#04121a;border:0;font-weight:bold}
#sendForm #micBtn{background:rgba(var(--accrgb),.07);border:1px solid rgba(var(--accrgb),.33);color:var(--acc)}
@media (prefers-reduced-motion:no-preference){.msg{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div id="splash">
  <svg viewBox="0 0 120 60" width="180" height="90"><path pathLength="1" d="M60 30C75 8 108 8 108 30C108 52 75 52 60 30C45 8 12 8 12 30C12 52 45 52 60 30Z"/></svg>

<script>setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("out");setTimeout(function(){s.remove()},600)}},2000)</script>
<div class="app">

  <section id="authView">
    <div class="logo">∞ INFINITY<span> CHAT</span></div>
    <p class="muted">Your private space</p>
    <div class="glass box">
      <input id="nameIn" placeholder="Your name (for new account)">
      <input id="inviteIn" placeholder="Invite code (for new account)" autocomplete="off">
      <input id="emailIn" type="email" placeholder="Email">
      <input id="passIn" type="password" placeholder="Password (6+ characters)">
      <button class="btn" id="loginBtn">Log in</button>
      <button class="btn ghost" id="signupBtn">Create account</button>
      <p class="err" id="authMsg"></p>
    </div>
  </section>

  <section id="homeView" class="hidden">
    <header>
      <div class="logo">∞ INFINITY<span> CHAT</span></div>
      <div class="hbtns"><button class="icon" id="newGroupBtn" title="New group" aria-label="New group"><svg class="ic"><use href="#i-users"/></svg></button><button class="icon" id="settingsBtn" title="Profile and settings" aria-label="Profile and settings"><svg class="ic"><use href="#i-user"/></svg></button></div>
    </header>
    <div class="welcome">
      <h1 id="hello">Stay connected</h1>
      <p class="muted">Pick a friend to start chatting.</p>
    </div>
    <div class="stories" id="stories"></div>
    <input id="search" placeholder="Search friends...">
    <div id="users"></div>
  </section>

  <section id="setView" class="hidden">
    <header>
      <button class="icon" id="setBack" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
      <b>Profile</b>
      <span style="width:43px"></span>
    </header>
    <div class="hero glass">
      <div class="banner"></div>
      <div class="heroav"><div id="setAv"></div><span class="camb"><svg class="ic"><use href="#i-camera"/></svg></span></div>
      <div class="heroname" id="heroName"></div>
      <div class="muted" id="heroBio"></div>
    </div>
    <input id="photoIn" type="file" accept="image/*" class="hidden">
    <div class="glass box" style="margin-top:14px">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile, deleteUser } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, deleteDoc, deleteField, collection, query, where, orderBy, limit, increment, Timestamp, onSnapshot,
  addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvxH50paoEuJ9FgzYY8VRye6DpQdESMQY",
  authDomain: "infinity-chat-d7f68.firebaseapp.com",
  projectId: "infinity-chat-d7f68",
  messagingSenderId: "425458605087",
  appId: "1:425458605087:web:7857813f1efa4b2077892a"
};
// Photos ke liye: cloudinary.com ka free account, phir yahan dono cheezein daalo
const CLOUD = { name: "aan2nko5", preset: "infinity-chat" };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try{ db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ db = getFirestore(app); }
const $ = id => document.getElementById(id);
const ms = t => (t && t.toMillis) ? t.toMillis() : 0;
const fmt = n => new Date(n).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const online = u => !u.hideOnline && Date.now() - ms(u.lastSeen) < 130000;
const okImg = s => typeof s === "string" && s.startsWith("https://res.cloudinary.com/");
let me = null, myDoc = {}, allUsers = [], peer = null, typing = false, chatId = null;
let chatCol = "chats", curGroup = null, typerName = "";
let unsubUsers = null, unsubMsgs = null, unsubChat = null, lastTyped = 0, newPhoto = null;
let chatMeta = {}, metaUnsubs = {}, msgDocs = [], peerReadMs = 0;
let unsubStatus = null, statuses = [], vList = [], vIdx = 0, vTimer = null;
let groups = [], unsubGroups = null, pvUrl = "";
let blocked = new Set(), unsubPrefs = null, muted = new Set();
try{ muted = new Set(JSON.parse(localStorage.getItem("ic-mute") || "[]")); }catch(e){}
const pairId = uid => [me.uid, uid].sort().join("_");

function show(view){
  ["authView","homeView","setView","skinView","groupView","infoView","chatView"].forEach(v => $(v).classList.toggle("hidden", v !== view));
  const el = $(view);
  el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
}

function setTheme(t){
  document.body.dataset.theme = t;
  try{ localStorage.setItem("ic-theme", t); }catch(e){}
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.t === t));
}
let saved = "glass";
try{ saved = localStorage.getItem("ic-theme") || "glass"; }catch(e){}
setTheme(saved);
document.querySelectorAll(".chip").forEach(c => c.onclick = () => setTheme(c.dataset.t));

async function upload(file, kind, fname){
  if(CLOUD.name.startsWith("PASTE")){ alert("Photo setup pending: code mein Cloudinary cloud name aur upload preset daalo."); return null; }
  try{
    const fd = new FormData();
    if(fname) fd.append("file", file, fname); else fd.append("file", file);
    fd.append("upload_preset", CLOUD.preset);
    const r = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD.name + "/" + (kind || "image") + "/upload", { method: "POST", body: fd });
    const j = await r.json();
    return j.secure_url || null;
  }catch(e){ alert("Upload failed. Check internet and Cloudinary settings."); return null; }
}

function avatar(u, cls){
  const a = document.createElement("div");
  a.className = "avatar " + (cls || "");
  if(okImg(u.photo)){ const i = document.createElement("img"); i.src = u.photo; a.append(i); }
  else a.textContent = (u.name || "?").charAt(0).toUpperCase();
  if(online(u)){ const d = document.createElement("i"); d.className = "dot"; a.append(d); }
  return a;
}

$("signupBtn").onclick = async () => {
  const name = $("nameIn").value.trim(), code = $("inviteIn").value.trim();
  if(!name){ $("authMsg").textContent = "Enter your name first."; return; }
  if(!code){ $("authMsg").textContent = "Enter the invite code."; return; }
  signingUp = true;
  let c = null, msg = "";
  try{
    c = await createUserWithEmailAndPassword(auth, $("emailIn").value.trim(), $("passIn").value);
    await setDoc(doc(db, "users", c.user.uid),
      { uid: c.user.uid, name, email: c.user.email, bio: "", photo: "", invite: code, lastSeen: serverTimestamp() });
    await updateProfile(c.user, { displayName: name });
  }catch(e){
    msg = e.code === "permission-denied" ? "Wrong invite code." : (e.code || e.message);
    if(c){ try{ await deleteUser(c.user); }catch(_){ try{ await signOut(auth); }catch(__){} } }
  }
  signingUp = false;
  await begin(auth.currentUser);
  if(msg) $("authMsg").textContent = msg;
};

$("loginBtn").onclick = async () => {
  try{ await signInWithEmailAndPassword(auth, $("emailIn").value.trim(), $("passIn").value); }
  catch(e){ $("authMsg").textContent = e.code || e.message; }
};

$("logoutBtn").onclick = () => signOut(auth);

function beat(){
  if(me && !document.hidden && !myDoc.hideOnline)
    setDoc(doc(db, "users", me.uid), { lastSeen: serverTimestamp() }, { merge: true }).catch(() => {});
}
setInterval(beat, 60000);
document.addEventListener("visibilitychange", () => { beat(); markRead(); });
setInterval(() => { if(me){ renderUsers(); updateStatus(); renderStatus(); } }, 30000);

let signingUp = false;
onAuthStateChanged(auth, user => { if(!signingUp) begin(user); });

async function begin(user){
  me = user;
  [unsubUsers, unsubMsgs, unsubChat, unsubStatus, unsubGroups, unsubPrefs].forEach(f => f && f());
  unsubUsers = unsubMsgs = unsubChat = unsubStatus = unsubGroups = unsubPrefs = null;
  statuses = []; groups = []; blocked = new Set(); closeViewer();
  Object.values(metaUnsubs).forEach(f => f());
  metaUnsubs = {}; chatMeta = {};
  if(!user){ show("authView"); return; }
  try{
    const s = await getDoc(doc(db, "users", user.uid));
    if(!s.exists()){
      me = null; show("authView");
      $("authMsg").textContent = "This account has no access. Create a new account with the invite code.";
      signOut(auth);
      return;
    }
  }catch(e){}
  $("authMsg").textContent = "";
  $("hello").textContent = user.displayName || user.email;
  show("homeView");
  beat();
  unsubPrefs = onSnapshot(doc(db, "users", user.uid, "private", "prefs"), s => {
    blocked = new Set((s.data() || {}).blocked || []);
    renderUsers(); renderStatus();
    if(chatId) renderMsgs();
    if(!$("infoView").classList.contains("hidden")) renderInfo();
  }, () => {});
  unsubGroups = onSnapshot(query(collection(db, "groups"), where("members", "array-contains", user.uid)), snap => {
    groups = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderUsers();
  }, () => {});
  unsubStatus = onSnapshot(query(collection(db, "statuses"),
    where("createdAt", ">", Timestamp.fromMillis(Date.now() - 86400000)), orderBy("createdAt")), snap => {
    statuses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStatus();
  }, () => {});
  unsubUsers = onSnapshot(collection(db, "users"), snap => {
    const all = snap.docs.map(d => d.data()).filter(u => u.uid && u.name);
    myDoc = all.find(u => u.uid === me.uid) || {};
    allUsers = all.filter(u => u.uid !== me.uid);
    syncMeta(); renderUsers(); updateStatus(); renderStatus(); renderPrivacy();
  }, err => { $("users").textContent = err.code; });
}

$("search").oninput = renderUsers;

function syncMeta(){
  allUsers.forEach(u => {
    if(metaUnsubs[u.uid]) return;
    metaUnsubs[u.uid] = onSnapshot(doc(db, "chats", pairId(u.uid)), s => {
      chatMeta[u.uid] = s.data() || {};
      renderUsers();
    }, () => {});
  });
}

function shortTime(n){
  const d = new Date(n);
  return d.toDateString() === new Date().toDateString()
    ? fmt(n) : d.toLocaleDateString([], { day: "numeric", month: "short" });
}

function renderUsers(){
  const q = $("search").value.toLowerCase();
  const meta = u => chatMeta[u.uid] || {};
  const items = [
    ...allUsers.filter(u => u.name.toLowerCase().includes(q)).map(u => ({ k: "u", u, m: meta(u), name: u.name })),
    ...groups.filter(g => (g.name || "").toLowerCase().includes(q)).map(g => ({ k: "g", g, m: g, name: g.name || "Group" }))
  ].sort((a, b) => ms(b.m.lastAt) - ms(a.m.lastAt) || a.name.localeCompare(b.name));
  let total = 0;
  allUsers.forEach(u => { if(!blocked.has(u.uid) && !muted.has("u:" + u.uid)) total += meta(u)["u_" + me.uid] || 0; });
  groups.forEach(g => { if(!muted.has("g:" + g.id)) total += g["u_" + me.uid] || 0; });
  document.title = (total ? "(" + total + ") " : "") + "Infinity Chat";
  const box = $("users");
  box.replaceChildren();
  if(!items.length){
    const p = document.createElement("p");
    p.className = "muted empty";
    p.textContent = allUsers.length || groups.length ? "Nothing found." : "No friends yet. Ask a friend to create an account.";
    box.append(p);
    return;
  }
  items.forEach(it => {
    const isG = it.k === "g", m = it.m, bl = !isG && blocked.has(it.u.uid), mu = muted.has(isG ? "g:" + it.g.id : "u:" + it.u.uid), unread = bl ? 0 : (m["u_" + me.uid] || 0);
    const row = document.createElement("div");
    row.className = "chat glass";
    const info = document.createElement("div");
    info.className = "grow";
    const nm = document.createElement("div");
    nm.className = "name"; nm.textContent = it.name;
    const sub = document.createElement("div");
    sub.className = "muted";
    if(isG) sub.textContent = m.lastText ? (m.lastFrom === me.uid ? "You" : (m.lastFromName || "Someone")) + ": " + m.lastText : it.g.members.length + " members";
    else if(bl) sub.textContent = "Blocked";
    else sub.textContent = m.lastText ? (m.lastFrom === me.uid ? "You: " : "") + m.lastText : (online(it.u) ? "online" : (it.u.bio || "Tap to chat"));
    info.append(nm, sub);
    row.append(isG ? groupAvatar(it.g) : avatar(it.u), info);
    if(ms(m.lastAt) || unread){
      const side = document.createElement("div");
      side.className = "side";
      const tm = document.createElement("div");
      tm.className = "time";
      tm.textContent = ms(m.lastAt) ? shortTime(ms(m.lastAt)) : "";
      side.append(tm);
      if(unread){
        const b = document.createElement("span");
        b.className = "badge" + (mu ? " mute" : "");
        b.textContent = unread > 99 ? "99+" : unread;
        side.append(b);
      }
      row.append(side);
    }
    row.onclick = () => isG ? openGroup(it.g) : openChat(it.u);
    box.append(row);
  });
}

function updateStatus(){
  if($("chatView").classList.contains("hidden")) return;
  if(curGroup){
    $("chatStatus").textContent = typing ? (typerName ? typerName + " is typing" : "typing") : curGroup.members.length + " members";
    $("chatStatus").className = typing ? "typing" : "";
    return;
  }
  if(!peer) return;
  const u = allUsers.find(x => x.uid === peer.uid) || peer;
  let t = "offline";
  if(typing) t = "typing";
  else if(online(u)) t = "online";
  else if(ms(u.lastSeen) && !u.hideOnline) t = "last seen " + fmt(ms(u.lastSeen));
  $("chatStatus").textContent = t;
  $("chatStatus").className = typing ? "typing" : "";
}

function renderMsgs(){
  const box = $("msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.replaceChildren();
  msgDocs.forEach(d => {
    const m = d.data(), mine = m.from === me.uid;
    if(blocked.has(m.from)) return;
    const el = document.createElement("div");
    el.className = "msg " + (mine ? "mine" : "theirs");
    if(curGroup && !mine){
      const sn = document.createElement("div");
      sn.className = "sname";
      sn.textContent = m.fromName || nameOf(m.from) || "Friend";
      el.append(sn);
    }
    if(m.replyTo){
      const q = document.createElement("div");
      q.className = "quote";
      const qn = document.createElement("b");
      qn.textContent = nameOf(m.replyTo.from);
      const qt = document.createElement("div");
      qt.textContent = m.replyTo.text || "";
      q.append(qn, qt);
      el.append(q);
    }
    if(m.type === "img" && okImg(m.url)){
      const i = document.createElement("img");
      i.src = m.url;
      i.onclick = ev => { ev.stopPropagation(); openPhoto(m.url); };
      i.onload = () => { box.scrollTop = box.scrollHeight; };
      el.append(i);
    }else if(m.type === "audio" && okImg(m.url)){
      el.append(audioBubble(m.url, m.dur));
    }else{
      const t = document.createElement("div");
      t.textContent = m.text || "";
      el.append(t);
    }
    const counts = {};
    Object.values(m.reactions || {}).forEach(e => { counts[e] = (counts[e] || 0) + 1; });
    const keys = Object.keys(counts);
    if(keys.length){
      const r = document.createElement("div");
      r.className = "rx";
      r.textContent = keys.map(e => e + (counts[e] > 1 ? " " + counts[e] : "")).join("  ");
      el.append(r);
    }
    const at = ms(m.createdAt);
    const tm = document.createElement("small");
    tm.textContent = fmt(at || Date.now()) + " ";
    if(mine){
      const seen = at && at <= peerReadMs;
      const k = document.createElement("span");
      k.className = "tick" + (seen ? " seen" : "");
      k.textContent = seen ? "✓✓" : "✓";
      tm.append(k);
    }
    el.append(tm);
    el.onclick = () => openSheet(d, m, mine);
    el.oncontextmenu = ev => { ev.preventDefault(); openSheet(d, m, mine); };
    box.append(el);
  });
  if(near) box.scrollTop = box.scrollHeight;
}

function markRead(){
  if(!chatId || !me || document.hidden) return;
  const p = { ["u_" + me.uid]: 0 };
  if(!myDoc.hideSeen) p["r_" + me.uid] = serverTimestamp();
  setDoc(doc(db, chatCol, chatId), p, { merge: true }).catch(() => {});
}

function touchChat(text){
  if(!chatId) return;
  const base = { lastText: text.slice(0, 60), lastFrom: me.uid, lastAt: serverTimestamp() };
  if(curGroup){
    base.lastFromName = myName();
    curGroup.members.forEach(id => { if(id !== me.uid) base["u_" + id] = increment(1); });
  }else if(peer) base["u_" + peer.uid] = increment(1);
  else return;
  setDoc(doc(db, chatCol, chatId), base, { merge: true }).catch(() => {});
}

function openGroup(g){
  curGroup = g; peer = null; chatCol = "groups"; chatId = g.id;
  typing = false; typerName = ""; peerReadMs = 0; msgDocs = []; clearReply();
  $("chatName").textContent = g.name;
  $("chatAv").replaceChildren(groupAvatar(g, "sm"));
  $("msgs").replaceChildren();
  show("chatView");
  updateStatus();
  const q = query(collection(db, chatCol, chatId, "messages"), orderBy("createdAt", "desc"), limit(50));
  unsubMsgs = onSnapshot(q, snap => {
    msgDocs = snap.docs.slice().reverse();
    renderMsgs();
    const last = msgDocs[msgDocs.length - 1];
    if(last && last.data().from !== me.uid) markRead();
  });
  unsubChat = onSnapshot(doc(db, chatCol, chatId), s => {
    const d = s.data() || {};
    if(s.exists() && curGroup) curGroup = { ...curGroup, ...d, id: chatId };
    const others = curGroup.members.filter(id => id !== me.uid);
    const live = () => others.find(id => Date.now() - (d["t_" + id] || 0) < 4000);
    const tp = live();
    typing = !!tp; typerName = tp ? nameOf(tp) : "";
    updateStatus();
    if(tp) setTimeout(() => { const t2 = live(); typing = !!t2; typerName = t2 ? nameOf(t2) : ""; updateStatus(); }, 4100);
    const rs = others.map(id => ms(d["r_" + id]));
    const r = rs.length ? Math.min(...rs) : 0;
    if(r !== peerReadMs){ peerReadMs = r; renderMsgs(); }
  });
  markRead();
}

function openChat(u){
  curGroup = null; chatCol = "chats"; peer = u; typing = false; typerName = ""; peerReadMs = 0; msgDocs = []; clearReply();

  unsubMsgs = onSnapshot(q, snap => {
    msgDocs = snap.docs.slice().reverse();
    renderMsgs();
    const last = msgDocs[msgDocs.length - 1];
    if(last && last.data().from !== me.uid) markRead();
  });
  unsubChat = onSnapshot(doc(db, chatCol, chatId), s => {
    const d = s.data() || {};
    const t = d["t_" + u.uid] || 0;
    typing = Date.now() - t < 4000;
    updateStatus();
    if(typing) setTimeout(() => { typing = Date.now() - t < 4000; updateStatus(); }, 4100);
    const r = ms(d["r_" + u.uid]);
    if(r !== peerReadMs){ peerReadMs = r; renderMsgs(); }
  });
  markRead();
}

function applySkin(){
  const r = document.documentElement.style, a = ACCENTS[skin.acc] || ACCENTS[0];
  r.setProperty("--acc", a[0]); r.setProperty("--accrgb", a[1]);
  r.setProperty("--acc2", a[2]); r.setProperty("--acc2rgb", a[3]);
  r.setProperty("--blurpx", skin.blur + "px");
  r.setProperty("--ca", String(skin.alpha / 100));
  const w = skin.wall === "photo" && okImg(skin.wallUrl) ? 'url("' + skin.wallUrl + '") center/cover' : (WALLS[skin.wall] || "none");
  r.setProperty("--wall", w);
  document.body.dataset.bubble = skin.bubble;
  document.querySelectorAll("#swatches .sw").forEach((b, i) => b.classList.toggle("on", i === skin.acc));
  document.querySelectorAll("#walls .opt").forEach(b => b.classList.toggle("on", b.dataset.v === skin.wall));
  document.querySelectorAll("#bubbles .opt").forEach(b => b.classList.toggle("on", b.dataset.v === skin.bubble));
  $("blurR").value = skin.blur; $("alphaR").value = skin.alpha;
  $("blurVal").textContent = skin.blur + "px"; $("alphaVal").textContent = skin.alpha + "%";

  try{ localStorage.setItem("ic-skin", JSON.stringify(skin)); }catch(e){}

function buildSkin(){
  const sw = $("swatches");
  ACCENTS.forEach((a, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "sw"; b.setAttribute("aria-label", "Accent " + (i + 1));
    b.style.background = "linear-gradient(135deg," + a[0] + "," + a[2] + ")";
    b.onclick = () => { skin.acc = i; saveSkin(); };
    sw.append(b);
  });
  const mk = (box, items, key) => items.forEach(([val, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.textContent = label; b.dataset.v = val;
    b.onclick = () => { if(val === "photo"){ $("wallIn").click(); return; } skin[key] = val; saveSkin(); };
    box.append(b);
  });
  mk($("walls"), [["none","None"],["aurora","Aurora"],["dots","Dots"],["grid","Grid"],["photo","Photo"]], "wall");
  mk($("bubbles"), [["glass","Glass"],["solid","Solid"],["soft","Soft"],["outline","Outline"]], "bubble");
  $("blurR").oninput = () => { skin.blur = +$("blurR").value; saveSkin(); };
  $("alphaR").oninput = () => { skin.alpha = +$("alphaR").value; saveSkin(); };
  $("wallIn").onchange = async e => {
    const f = e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const url = await upload(f);
    if(url){ skin.wall = "photo"; skin.wallUrl = url; saveSkin(); }
  };
  $("skinReset").onclick = () => { skin = { ...SKIN0 }; saveSkin(); };
  $("openSkin").onclick = () => show("skinView");
  $("skinBack").onclick = () => show("setView");
}

let curAudio = null, curBtn = null;
function audioBubble(url, dur){
  const w = document.createElement("div");
  w.className = "voice";
  const b = document.createElement("button");
  b.type = "button"; b.className = "vplay"; b.setAttribute("aria-label", "Play voice message");
  b.append(svgIcon("play"));
  const bar = document.createElement("div");
  bar.className = "vbar";
  const fill = document.createElement("i");
  bar.append(fill);
  const t = document.createElement("span");
  t.className = "vtime"; t.textContent = fmtDur(dur);
  let a = null;
  const reset = () => b.replaceChildren(svgIcon("play"));
  b.onclick = ev => {
    ev.stopPropagation();
    if(a && !a.paused){ a.pause(); reset(); return; }
    if(curAudio && curAudio !== a){ curAudio.pause(); if(curBtn) curBtn.replaceChildren(svgIcon("play")); }
    if(!a){
      a = new Audio(url);
      a.ontimeupdate = () => { fill.style.width = Math.min(100, a.currentTime / (dur || a.duration || 1) * 100) + "%"; };
      a.onended = () => { reset(); fill.style.width = "0"; };
    }
    curAudio = a; curBtn = b;
    a.play().then(() => b.replaceChildren(svgIcon("pause"))).catch(() => {});
  };
  w.append(b, bar, t);
  return w;
}

let rec = null, recChunks = [], recStart = 0, recTimer = null, recStream = null, recCancel = false;
async function startRec(){
  if(!chatId || rec) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert("Voice messages are not supported on this browser."); return; }
  try{ recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ alert("Please allow the microphone to send voice messages."); return; }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  rec = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
  recChunks = []; recCancel = false;
  const target = chatId;
  rec.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = async () => {
    recStream.getTracks().forEach(t => t.stop());
    clearInterval(recTimer);
    $("recBar").classList.add("hidden");
    const type = rec.mimeType || mime || "audio/webm", chunks = recChunks, cancelled = recCancel;
    rec = null;
    if(cancelled || !chunks.length) return;
    const dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
    const url = await upload(new Blob(chunks, { type }), "auto", "voice." + (type.includes("mp4") ? "m4a" : "webm"));
    if(!url || chatId !== target) return;
    addDoc(collection(db, chatCol, chatId, "messages"),
      { type: "audio", url, dur, from: me.uid, createdAt: serverTimestamp(), ...(curGroup ? { fromName: myName() } : {}) }).catch(() => {});
    touchChat("🎤 Voice message");
  };
  rec.start();
  recStart = Date.now();
  $("recTime").textContent = "0:00";
  $("recBar").classList.remove("hidden");
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $("recTime").textContent = fmtDur(s);
    if(s >= 120) stopRec(false);
  }, 500);
}
function stopRec(cancel){
  if(rec && rec.state !== "inactive"){ recCancel = cancel; rec.stop(); }
}
$("micBtn").onclick = startRec;
$("recSend").onclick = () => stopRec(false);
$("recCancel").onclick = () => stopRec(true);

function drawSetAv(){
  $("setAv").replaceChildren(avatar({ name: $("setName").value || myDoc.name, photo: newPhoto || myDoc.photo }, "big"));
}
$("settingsBtn").onclick = () => {
  $("setName").value = myDoc.name || me.displayName || "";
  $("setBio").value = myDoc.bio || "";
  $("setMsg").textContent = ""; newPhoto = null;
  drawSetAv(); fillHero(); show("setView");
};
$("setBack").onclick = () => show("homeView");
$("setAv").onclick = () => $("photoIn").click();
$("photoIn").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const url = await upload(f);
  if(url){ newPhoto = url; drawSetAv(); }
};
$("saveBtn").onclick = async () => {
  const name = $("setName").value.trim();
  if(!name){ $("setMsg").textContent = "Name cannot be empty."; return; }
  try{
    await updateProfile(me, { displayName: name });
    await setDoc(doc(db, "users", me.uid),
      { name, bio: $("setBio").value.trim(), photo: newPhoto || myDoc.photo || "" }, { merge: true });
    $("hello").textContent = name;
    show("homeView");
  }catch(e){ $("setMsg").textContent = e.code || e.message; }
};
